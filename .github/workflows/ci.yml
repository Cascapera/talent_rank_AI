name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Versão fixa: ruff sem pin muda de formatação sozinho e reprova um PR
      # que não mudou nada. Tem que ser a mesma de requirements-dev.txt e do
      # .pre-commit-config.yaml.
      - name: Install Ruff
        run: pip install ruff==0.15.17

      - name: Run Ruff
        run: ruff check . && ruff format --check .

  test:
    runs-on: ubuntu-latest
    # 3.10 é o que roda em produção (Ubuntu do Lightsail) — é o portão real.
    # 3.12 roda junto para provar que o upgrade futuro está limpo, antes do
    # fim do suporte do 3.10 em outubro/2026.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    name: test (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: talent_query.settings_test
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: "False"
        run: |
          python manage.py migrate --noinput
          pytest --cov=core --cov-report=xml --cov-fail-under=72 -v

      - name: Upload coverage
        if: matrix.python-version == '3.10'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
