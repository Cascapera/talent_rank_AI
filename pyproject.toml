[project]
name = "talent-rank-ai"
version = "0.1.0"
description = "Plataforma de recrutamento com IA para ranking de candidatos"
readme = "README.md"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".git", ".venv", "venv", "__pycache__", "migrations", "staticfiles", "media"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B904",   # raise without from inside except
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"core/tests/*" = ["S101"]  # assert in tests ok

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "talent_query.settings_test"
pythonpath = ["."]
addopts = "-v --tb=short"
testpaths = ["core"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::PendingDeprecationWarning"]

[tool.coverage.run]
source = ["core"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__init__.py",
    "core/views.py",      # Views: integração HTTP, testar via E2E
    "core/urls.py",       # Rotas: configuração, não lógica
    "core/apps.py",       # AppConfig, sem lógica
    "core/llm_extractor.py",   # Chamadas à API Gemini, testar via integração
    "core/pdf_extractor.py",   # PDF + DB + API, testar via integração
]
branch = true

[tool.coverage.report]
fail_under = 50
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
