[project]
name = "talent-rank-ai"
version = "0.1.0"
description = "Plataforma de recrutamento com IA para ranking de candidatos"
readme = "README.md"
# Produção roda Python 3.10.12 (confirmado por `pip freeze` no servidor em
# 2026-08-17). Declarar 3.12 aqui era ficção: a suíte nunca tinha rodado na
# versão que atende as usuárias. Só sobe quando o servidor subir.
requires-python = ">=3.10"

[tool.ruff]
# py310, não py312: com a regra `UP` (pyupgrade) ligada e o `make format`
# rodando `ruff check --fix .`, um target alto autoriza o ruff a reescrever o
# código em sintaxe 3.11/3.12. Isso passaria no CI e quebraria em produção.
target-version = "py310"
line-length = 100
exclude = [".git", ".venv", "venv", "__pycache__", "migrations", "staticfiles", "media"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B904",   # raise without from inside except
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"core/tests/*" = ["S101"]  # assert in tests ok

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "talent_query.settings_test"
pythonpath = ["."]
addopts = "-v --tb=short"
testpaths = ["core"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::PendingDeprecationWarning"]

[tool.coverage.run]
source = ["core"]
# Nada de código de aplicação é omitido: o número tem que ser o real.
# views.py, llm_extractor.py e pdf_extractor.py ficavam de fora e escondiam
# 1.820 dos 2.241 statements — o CI reportava 88% medindo 19% do código.
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__init__.py",
]
branch = true

[tool.coverage.report]
# Piso = cobertura real de hoje menos 1 ponto, para o CI travar em regressão
# sem travar o dia a dia. Sobe a cada onda do PROJETO_REFATORACAO.md (meta: 55).
# 27 -> 34 (R-05, upsert) -> 37 (R-06, lotes) -> 42 (R-09, banco de talentos)
# -> 41 (R-10) -> 53 (R-07, cliente LLM). A queda de 42,12 para 41,84 nao e
# regressao: o codigo duplicado removido em R-10 estava coberto, entao numerador
# e denominador cairam juntos (1.755 -> 1.684 statements). Em absoluto ha menos
# codigo sem teste do que antes.
# O salto do R-07 (41,83 -> 53,58) veio do llm_extractor, que saiu de 20% para
# 71% com os 50 characterization tests. -> 55 (R-36).
# META DE 55% DA SECAO 10 BATIDA em 2026-08-17: 55,94%. -> 62 (R-33, search pool),
# que levou o pdf_extractor de 57% para 88%.
# 72 (R-38, filtros) -> 71 (R-15). A queda de 72,08 para 71,41 NAO e regressao,
# pelo mesmo motivo do R-10 e do R-37: o R-15 removeu 90 linhas de views.py que
# estavam cobertas, entao numerador e denominador cairam juntos. Nenhum teste foi
# perdido - a suite continua com os mesmos 260.
fail_under = 75
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
