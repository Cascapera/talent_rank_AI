{% load static %}
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login — Talent Rank AI</title>
  <link rel="icon" type="image/png" href="{% static 'img/fav.png' %}" />
  <link rel="stylesheet" href="{% static 'css/tokens.css' %}" />
  <link rel="stylesheet" href="{% static 'css/auth.css' %}" />
</head>
<body>
  <div class="card">
    <div class="brand">
      <img src="{% static 'img/logo.png' %}" alt="Talent Rank AI" />
    </div>
    <h1>Acesse sua conta</h1>
    <p>Entre com seu usuário e senha para acessar o dashboard.</p>

    {% if form.errors %}
      <div class="error">Usuário ou senha inválidos.</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <label for="id_username">Usuário</label>
      {{ form.username }}
      <label for="id_password">Senha</label>
      {{ form.password }}
      <button class="btn" type="submit">Entrar</button>
    </form>
    <div class="footer">
      Não tem conta? <a href="{% url 'signup' %}" style="color: var(--primary); font-weight: 600;">Cadastre-se</a><br />
      <a href="{% url 'home' %}">Voltar para a home</a>
    </div>
  </div>
</body>
</html>
